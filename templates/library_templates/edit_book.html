{% extends "base.html" %}
{% block content %}
<style>
.hero-header {
  background: linear-gradient(135deg,#00b09b,#96c93d);
  color:white;
  padding:40px 20px;
  text-align:center;
  border-radius:15px;
  margin-bottom:30px;
  box-shadow:0 6px 20px rgba(0,0,0,0.15);
}
.form-card {
  max-width:700px;
  margin:auto;
  background:rgba(255,255,255,0.95);
  backdrop-filter:blur(10px);
  padding:30px;
  border-radius:15px;
  box-shadow:0 6px 20px rgba(0,0,0,0.1);
}
</style>

<div class="hero-header">
  <h2>✏️ Edit Book</h2>
  <p>Modify details of the existing record</p>
</div>

<div class="container">
  <div class="form-card">
    <form method="POST" action="{{ url_for('library_bp.edit_book', book_id=book.id) }}">
      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Title *</label>
          <input type="text" name="title" class="form-control" value="{{ book.title }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Author *</label>
          <input type="text" name="author" class="form-control" value="{{ book.author }}" required>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-4">
          <label class="form-label">Category</label>
          <input type="text" name="category" class="form-control" value="{{ book.category }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Total Copies *</label>
          <input type="number" name="copies_total" min="1" value="{{ book.copies_total }}" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">ISBN</label>
          <input type="text" name="isbn" class="form-control" value="{{ book.isbn }}">
        </div>
      </div>

      <button type="submit" class="btn btn-success w-100">💾 Update Book</button>
    </form>
  </div>
</div>
{% endblock %}
