{% extends "base.html" %}
{% block content %}
<style>
.form-card { max-width:700px; margin:auto; background:white; padding:30px; border-radius:15px; box-shadow:0 6px 20px rgba(0,0,0,0.1);}
</style>

<div class="container mt-4">
  <div class="form-card">
    <h3>📤 Upload Digital Resource</h3>
    <form method="POST" enctype="multipart/form-data" class="mt-3">
      <div class="mb-3">
        <label class="form-label">Title *</label>
        <input type="text" name="title" class="form-control" required>
      </div>
      <div class="mb-3">
        <label>Description</label>
        <textarea name="description" class="form-control"></textarea>
      </div>
      <div class="mb-3">
        <label>Category (e.g., AI / Semester 4)</label>
        <input type="text" name="category" class="form-control">
      </div>
      <div class="mb-3">
        <label>File (.pdf/.epub/.txt)</label>
        <input type="file" name="file" class="form-control" required>
      </div>
      <button class="btn btn-success">Upload</button>
    </form>
  </div>
</div>
{% endblock %}
