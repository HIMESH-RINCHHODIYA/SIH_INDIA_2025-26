{% extends "base.html" %}
{% block content %}

<style>
.chat-container {
  max-width: 800px;
  margin: auto;
  background: #fdfdfd;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0px 6px 20px rgba(0,0,0,0.1);
}
.chat-header {
  border-bottom: 1px solid #ddd;
  padding-bottom: 8px;
  margin-bottom: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.chat-header h3 { margin: 0; }
.chat-header small { color: #555; font-size: 0.9rem; }

.chat-box {
  height: 400px;
  overflow-y: auto;
  border: 1px solid #ddd;
  padding: 10px;
  border-radius: 8px;
  background: #fff;
}
.chat-message {
  margin-bottom: 15px;
  padding: 10px;
  border-radius: 8px;
  max-width: 75%;
  white-space: pre-wrap;            /* preserve formatting */
  word-wrap: break-word;            /* long words wrap correctly */
}
.user-message {
  background: #e1f5fe;
  margin-left: auto;
  text-align: right;
}
.bot-message {
  background: #f1f8e9;
  margin-right: auto;
}
.loading-message {
  background: #f0f0f0;
  color: #666;
  font-style: italic;
  margin-right: auto;
}
</style>

<div class="chat-container">
  <div class="chat-header">
    <h3>🤖 Library Chatbot Assistant</h3>
    <small>👋 Logged in as: <b>{{ current_user.name }}</b> ({{ current_user.role }})</small>
  </div>

  <div id="chatBox" class="chat-box"></div>

  <form id="chatForm" class="mt-3">
    <div class="input-group">
      <input type="text" id="userInput" class="form-control" 
             placeholder="Ask about books, resources, branch, year, semester..." required>
      <button class="btn btn-primary" type="submit">Send</button>
    </div>
  </form>
</div>

<script>
const chatBox = document.getElementById("chatBox");
const form = document.getElementById("chatForm");
const input = document.getElementById("userInput");

form.addEventListener("submit", async (e)=>{
  e.preventDefault();
  const message = input.value.trim();
  if(!message) return;

  // show user message
  const userDiv=document.createElement("div");
  userDiv.classList.add("chat-message","user-message");
  userDiv.innerText= message;
  chatBox.appendChild(userDiv);
  chatBox.scrollTop = chatBox.scrollHeight;

  // show loading text while bot is "thinking"
  const loadingDiv=document.createElement("div");
  loadingDiv.classList.add("chat-message","loading-message");
  loadingDiv.innerText = "🤔 Thinking...";
  chatBox.appendChild(loadingDiv);
  chatBox.scrollTop = chatBox.scrollHeight;

  input.value="";

  // send to backend
  try {
    const res = await fetch("{{ url_for('chatbot_bp.chatbot_ask') }}",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({message})
    });
    const data = await res.json();

    // remove loading
    chatBox.removeChild(loadingDiv);

    // show bot reply (HTML-supported for links/formatting)
    const botDiv=document.createElement("div");
    botDiv.classList.add("chat-message","bot-message");
    botDiv.innerHTML = data.reply.replace(/\n/g,"<br>");
    chatBox.appendChild(botDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
  } catch (err) {
    loadingDiv.innerText = "⚠️ Error contacting bot.";
  }
});
</script>

{% endblock %}
