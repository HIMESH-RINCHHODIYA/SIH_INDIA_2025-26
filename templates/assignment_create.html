{% extends "base.html" %}
{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<div class="container mt-4">
  <h3>➕ Create Assignment</h3>

  <!-- Flash messages -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <!-- Assignment Form -->
  <form method="POST" enctype="multipart/form-data">

    <!-- Title -->
    <div class="mb-3">
      <label class="form-label">Assignment Title</label>
      <input type="text" name="title" class="form-control" required>
    </div>

    <!-- Description -->
    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea name="description" class="form-control"></textarea>
    </div>

    <!-- Deadline -->
    <div class="mb-3">
      <label class="form-label">Deadline</label>
      <input type="date" name="deadline" class="form-control" required>
    </div>

    <!-- Course -->
    <div class="mb-3">
      <label class="form-label">Course</label>
      <select name="course_id" class="form-select" required>
        <option value="" disabled selected>-- Select Course --</option>
        {% for c in courses %}
          <option value="{{ c.id }}">{{ c.course_name }} ({{ c.course_code }})</option>
        {% endfor %}
      </select>
    </div>

    <!-- Program / Branch / Year / Semester / Section -->
    <div class="row">
      <div class="col-md-3 mb-3">
        <label class="form-label">Program</label>
        <select name="program" id="program" class="form-select" required></select>
      </div>

      <div class="col-md-3 mb-3">
        <label class="form-label">Branch</label>
        <select name="branch" id="branch" class="form-select" required></select>
      </div>

      <div class="col-md-2 mb-3">
        <label class="form-label">Year</label>
        <select name="year" id="year" class="form-select" required></select>
      </div>

      <div class="col-md-2 mb-3">
        <label class="form-label">Semester</label>
        <select name="semester" id="semester" class="form-select" required></select>
      </div>

      <div class="col-md-2 mb-3">
        <label class="form-label">Section</label>
        <select name="section" id="section" class="form-select"></select>
      </div>
    </div>

    <!-- Attachment -->
    <div class="mb-3">
      <label class="form-label">Attachment (optional)</label>
      <input type="file" name="file" class="form-control">
    </div>

    <!-- Reference link -->
    <div class="mb-3">
      <label class="form-label">Reference Link (optional)</label>
      <input type="url" name="link_url" class="form-control" placeholder="https://...">
    </div>

    <button type="submit" class="btn btn-success">Create Assignment ✅</button>
  </form>
</div>

<script>
function fillSelect(id, arr) {
  const sel = document.getElementById(id);
  sel.innerHTML = '<option value="" disabled selected>-- Select --</option>';
  arr.forEach(v => {
    const o = document.createElement('option');
    o.value = v;
    o.textContent = v;
    sel.appendChild(o);
  });
}

async function loadDropdowns() {
  try {
    const res = await fetch("/api/dropdowns");  // ✅ Correct endpoint
    const data = await res.json();
    console.log("Assignment dropdowns:", data); // 👈 debug in console

    fillSelect("program", data.program || []);
    fillSelect("branch", data.branch || []);
    fillSelect("year", data.year || []);
    fillSelect("semester", data.semester || []);
    fillSelect("section", data.section || []);
  } catch (err) {
    console.error("Failed to load dropdowns:", err);
  }
}

document.addEventListener("DOMContentLoaded", loadDropdowns);
</script>
{% endblock %}
