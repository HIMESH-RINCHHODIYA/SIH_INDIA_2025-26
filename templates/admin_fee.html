<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Fee Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

  body { font-family:'Inter',sans-serif; margin:0; padding:0;
    background:linear-gradient(135deg,#00c6ff 0%,#0072ff 100%); color:#333; }

  .container { max-width:1200px; margin:20px auto; padding:20px; background:#fff;
    border-radius:12px; box-shadow:0 6px 18px rgba(0,0,0,0.1); }

  h1,h2,h3 { margin:10px 0; text-align:center; }
  h1 { color:#0072ff; font-size:24px; }
  h2,h3 { color:#0072ff; font-size:20px; }

  .dashboard-btn { display:inline-block; margin:10px 0; background:#0072ff;
    color:#fff; padding:8px 14px; border-radius:6px; text-decoration:none; font-size:14px; }
  .dashboard-btn:hover { background:#0056cc; }

  .card { background:#f9fbff; padding:15px; border-radius:10px; margin-bottom:20px;
    border-left:5px solid #0072ff; }
  .card h3 { font-size:18px; margin-bottom:10px; }
  label { font-weight:600; margin-right:5px; }
  select,input[type="number"],input[type="date"]{padding:6px;border:1px solid #ccc;border-radius:6px; margin:4px 0;}

  button { background:#0072ff; color:white; border:none; padding:7px 12px;
    border-radius:6px; cursor:pointer; font-size:13px; }
  button:hover { background:#0056cc; }

  table { width:100%; border-collapse:collapse; font-size:14px; }
  table th, table td { border:1px solid #ddd; padding:8px; text-align:center; }
  table th { background:#0072ff; color:white; }
  table tr:nth-child(even){background:#f9f9f9;}

  .status { font-weight:bold; padding:3px 8px; border-radius:5px; font-size:12px;}
  .Unpaid { background:#ffe6e6; color:#d32f2f; }
  .Pending { background:#fff4cc; color:#856404; }
  .Paid { background:#d4edda; color:#155724; }
  .Failed { background:#f8d7da; color:#721c24; }

  .modal {display:none; position:fixed; top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,0.6); z-index:1000; }
  .modal-content { background:#fff; margin:10% auto; padding:20px; border-radius:12px;
    max-width:700px; }
  @media(max-width:768px){
    body{font-size:14px;}
    table{font-size:12px;}
    .container{padding:10px;}
    .card{padding:10px;}
    .card h3{font-size:16px;}
  }
</style>
</head>
<body>
<div class="container">
  {% if college_logo %}
    <img src="{{ college_logo }}" alt="College Logo" class="logo" style="display:block;margin:0 auto;max-height:60px;">
  {% endif %}
  <h1>{{ college_name or "College Admin Panel" }}</h1>
  <a href="/dashboard" class="dashboard-btn">⬅ Back to Dashboard</a>
  <h2>💼 Admin Fee Dashboard</h2>

  <!-- Fee Config -->
  <div class="card">
    <h3>⚙️ Set Fee Configuration</h3>
    <form id="feeConfigForm">
      <label>Fee Category:</label>
      <select id="cfgFeeType">
        <option value="ACADEMIC">School/College Fee</option>
        <option value="HOSTEL">Hostel Fee</option>
      </select><br>
      <label>Program:</label><select id="cfgProgram"></select>
      <label>Branch:</label><select id="cfgBranch"></select>
      <label>Year:</label><select id="cfgYear"></select><br>
      <label>Amount (₹):</label><input type="number" step="0.01" id="cfgAmount" required>
      <label>Last Date:</label><input type="date" id="cfgLastDate" required>
      <button type="submit">💾 Save</button>
    </form>
  </div>

  <!-- Filters -->
  <div class="card">
    <h3>🔍 Filter Students</h3>
    <label>Mode:</label>
    <select id="filterMode">
      <option value="academic">By Academic</option>
      <option value="hostel">By Hostel</option>
    </select>
    <div id="academicFilters" style="margin-top:8px;">
      <label>Program:</label><select id="program"></select>
      <label>Branch:</label><select id="branch"></select>
      <label>Year:</label><select id="year"></select>
    </div>
    <div id="hostelFilters" style="margin-top:8px;display:none">
      <label>Hostel:</label><select id="hostelId"></select>
    </div>
    <button id="filterBtn" style="margin-top:8px;">Apply</button>
  </div>

  <!-- Students -->
  <div class="card">
    <h3>📑 Students</h3>
    <table id="studentsTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Program / Branch / Year</th>
          <th>Academic Fee</th>
          <th>Hostel Fee</th>
          <th>Payments</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- Modal -->
<div id="historyModal" class="modal">
  <div class="modal-content">
    <span onclick="closeModal()" style="float:right;cursor:pointer">&times;</span>
    <h3>📜 Payment History</h3>
    <table>
      <thead><tr><th>Date</th><th>Amount</th><th>Status</th><th>Fee Type</th></tr></thead>
      <tbody id="historyBody"></tbody>
    </table>
  </div>
</div>

<script>
function showToast(msg){ alert(msg); }

// Populate dropdowns
async function populateDropdowns(){
  try{
    const res=await fetch("/admin/fees/api/dropdowns");
    const data=await res.json();
    if(data.error)return showToast(data.error);
    function fill(id,arr){const sel=document.getElementById(id);sel.innerHTML="";arr.forEach(v=>sel.appendChild(new Option(v,v)));}
    fill("cfgProgram",data.programs); fill("cfgBranch",data.branches); fill("cfgYear",data.years);
    fill("program",["",...data.programs]); fill("branch",["",...data.branches]); fill("year",["",...data.years]);

    // load hostels for hostel filter if API exists (replace with your /api/hostels)
    try{
      const rh=await fetch("/hostel/api/list"); // create this endpoint to return hostels
      const hd=await rh.json(); const sel=document.getElementById("hostelId");
      sel.innerHTML=""; hd.forEach(h=>sel.appendChild(new Option(h.name,h.id)));
    }catch{}
  }catch(err){console.error(err);showToast("Dropdown error");}
}

// Student list
async function fetchStudents(){
  const mode=document.getElementById("filterMode").value;
  let url=`/admin/fees/api/students?mode=${mode}`;
  if(mode==="academic"){
    url+=`&program=${program.value}&branch=${branch.value}&year=${year.value}`;
  } else if(mode==="hostel"){
    url+=`&hostel_id=${hostelId.value}`;
  }
  const res=await fetch(url);
  const students=await res.json();

  const tbody=document.querySelector("#studentsTable tbody");
  tbody.innerHTML="";
  students.forEach(s=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${s.name}</td>
      <td>${s.email}</td>
      <td>${s.program||"-"} / ${s.branch||"-"} / ${s.year||"-"}</td>
      <td>Applied ₹${s.academic_fee.applied} | Paid ₹${s.academic_fee.paid} | Dues ₹${s.academic_fee.dues}</td>
      <td>Applied ₹${s.hostel_fee.applied} | Paid ₹${s.hostel_fee.paid} | Dues ₹${s.hostel_fee.dues}</td>
      <td><button onclick="viewPayments(${s.id})">🔍 View</button></td>`;
    tbody.appendChild(tr);
  });
}

// Save config
async function saveFeeConfig(e){
  e.preventDefault();
  const data={fee_type:cfgFeeType.value, program:cfgProgram.value, branch:cfgBranch.value, year:cfgYear.value,
              amount:parseFloat(cfgAmount.value), last_date:cfgLastDate.value};
  const res=await fetch("/admin/fees/api/save_fee_config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
  const r=await res.json(); showToast(r.message||r.error); fetchStudents();
}

// Payment history
async function viewPayments(sid){
  const res=await fetch(`/admin/fees/api/payments/${sid}`); const pays=await res.json();
  const tbody=document.getElementById("historyBody"); tbody.innerHTML="";
  pays.forEach(p=>{const tr=document.createElement("tr"); tr.innerHTML=`<td>${p.created_at}</td><td>₹${p.amount}</td>
    <td><span class="status ${p.status}">${p.status}</span></td><td>${p.fee_type}</td>`;tbody.appendChild(tr);});
  document.getElementById("historyModal").style.display="block";
}
function closeModal(){document.getElementById("historyModal").style.display="none";}

// Init
populateDropdowns(); fetchStudents();
document.getElementById("feeConfigForm").addEventListener("submit",saveFeeConfig);
document.getElementById("filterMode").addEventListener("change",()=>{
  document.getElementById("academicFilters").style.display=filterMode.value==="academic"?"block":"none";
  document.getElementById("hostelFilters").style.display=filterMode.value==="hostel"?"block":"none";
});
document.getElementById("filterBtn").addEventListener("click",fetchStudents);
</script>
</body>
</html>
