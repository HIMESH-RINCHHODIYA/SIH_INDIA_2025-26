{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>📝 Upload Student Grades</h2>

    <!-- Upload Form -->
    <form method="POST" class="mb-4">
      <div class="row g-3">
        <div class="col-md-3">
          <label class="form-label">Student</label>
          <select name="student_id" class="form-select" required>
            <option value="">-- Select Student --</option>
            {% for s in students %}
              <option value="{{ s.id }}">{{ s.name }} ({{ s.roll_no }})</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Course</label>
          <select name="course_id" class="form-select" required>
            <option value="">-- Select Course --</option>
            {% for c in courses %}
              <option value="{{ c.id }}">{{ c.course_code }} - {{ c.course_name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">Semester</label>
          <select name="semester" class="form-select" required>
            <option value="">-- Select Semester --</option>
            {% for sem in semesters %}
              <option value="{{ sem }}">{{ sem }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">Marks</label>
          <input type="number" name="marks" class="form-control" required>
        </div>
        <div class="col-md-1">
          <label class="form-label">Out Of</label>
          <input type="number" name="out_of" class="form-control" value="100" required>
        </div>
        <div class="col-md-1">
          <label class="form-label">Credits</label>
          <input type="number" name="credits" class="form-control" value="4" required>
        </div>
      </div>
      <button class="btn btn-success mt-3">Upload</button>
    </form>

    <!-- Export Section -->
    <h4 class="mt-4">⬇ Export Grades</h4>
    <form method="GET">
      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <label class="form-label">Filter by Course</label>
          <select name="course_id" class="form-select">
            <option value="">-- All Courses --</option>
            {% for c in courses %}
              <option value="{{ c.id }}">{{ c.course_code }} - {{ c.course_name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Filter by Semester</label>
          <select name="semester" class="form-select">
            <option value="">-- All Semesters --</option>
            {% for sem in semesters %}
              <option value="{{ sem }}">{{ sem }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-5 d-flex align-items-end gap-2">
          <button formaction="{{ url_for('grades_bp.export_grades_csv') }}" class="btn btn-outline-primary btn-sm">📊 CSV</button>
          <button formaction="{{ url_for('grades_bp.export_grades_xlsx') }}" class="btn btn-outline-success btn-sm">📑 Excel</button>
        </div>
      </div>
    </form>
</div>
{% endblock %}
